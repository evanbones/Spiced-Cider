import groovy.json.JsonSlurper

plugins {
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
    id 'co.uzzu.dotenv.gradle' version "4.0.0"
}

def packDir = layout.projectDirectory.dir("pack")
def packToml = packDir.file("pack.toml").asFile
def packwizExe = packDir.file("packwiz.exe").asFile
def packwiz = System.getProperty("os.name").toLowerCase().contains("windows") && packwizExe.exists() ? packwizExe.absolutePath : "packwiz"
def packVersion = version.toString()
def releaseConfig = layout.projectDirectory.file("pack-release.json").asFile
def mrpack = layout.buildDirectory.file("pack/${pack_name.replace(' ', '-')}-${packVersion}.mrpack")

def releaseDir = layout.buildDirectory.dir("pack/release")
def python = System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3"

var stageRelease = tasks.register("stageRelease", Exec) {
    group = "spiced cider"
    description = "Copies pack/ to build/pack/release with pack-release.json applied"
    inputs.file(releaseConfig)
    outputs.upToDateWhen { false }
    commandLine python, file("scripts/stage_release.py").absolutePath, packDir.asFile.absolutePath,
            releaseDir.get().asFile.absolutePath, "--release", releaseConfig.absolutePath, "--version", packVersion
}

var refreshRelease = tasks.register("refreshRelease", Exec) {
    group = "spiced cider"
    dependsOn(stageRelease)
    workingDir = releaseDir.get().asFile
    commandLine packwiz, "refresh"
}

var exportPack = tasks.register("exportPack", Exec) {
    group = "spiced cider"
    dependsOn(refreshRelease)
    workingDir = releaseDir.get().asFile
    outputs.file(mrpack)
    outputs.upToDateWhen { false }
    doFirst { mrpack.get().asFile.parentFile.mkdirs() }
    commandLine packwiz, "modrinth", "export", "--output", mrpack.get().asFile.absolutePath
}

def serverPack = layout.buildDirectory.file("pack/${pack_name.replace(' ', '-')}-${packVersion}-server.zip")
def downloadCache = layout.buildDirectory.dir("pack/cache").get().asFile
def serverPackFiles = layout.projectDirectory.dir("server-pack").asFile
def serverExcludedJars = pack_server_excluded_jars.split(",").collect { it.trim() }.findAll { !it.isEmpty() }
def serverDownloadedJars = pack_server_downloaded_jars.split(",").collect { it.trim() }.findAll { !it.isEmpty() }
def serverExcludedOverrides = ["resourcepacks/", "shaderpacks/", "PW-GUI.exe", "packwiz.exe", "unsup.toml", "icon.png"]
def neoInstallerUrl = "https://maven.neoforged.net/releases/net/neoforged/neoforge/${neo_version}/neoforge-${neo_version}-installer.jar"

var exportServerPack = tasks.register("exportServerPack") {
    group = "spiced cider"
    dependsOn(exportPack)
    inputs.files(mrpack)
    inputs.dir(serverPackFiles)
    outputs.file(serverPack)
    doLast {
        def fetch = { String url, String sha512 ->
            def cached = new File(downloadCache, sha512 ?: url.md5())
            if (!cached.exists()) {
                cached.parentFile.mkdirs()
                def tmp = new File(cached.path + ".part")
                new URL(url).withInputStream { input -> tmp.withOutputStream { it << input } }
                if (sha512 != null) {
                    def actual = java.security.MessageDigest.getInstance("SHA-512").digest(tmp.bytes).encodeHex().toString()
                    if (actual != sha512) {
                        tmp.delete()
                        throw new GradleException("Hash mismatch for ${url}")
                    }
                }
                tmp.renameTo(cached)
            }
            cached
        }
        def jarMatches = { String path, List prefixes ->
            def name = path.substring(path.lastIndexOf('/') + 1)
            path.startsWith("mods/") && prefixes.any { name.startsWith(it) }
        }
        def excludedJar = { String path -> jarMatches(path, serverExcludedJars) }
        def downloads = []
        def out = serverPack.get().asFile
        out.parentFile.mkdirs()
        def written = [] as Set
        new java.util.zip.ZipFile(mrpack.get().asFile).withCloseable { source ->
            def index = new JsonSlurper().parse(source.getInputStream(source.getEntry("modrinth.index.json")))
            new java.util.zip.ZipOutputStream(out.newOutputStream()).withCloseable { zip ->
                def put = { String path, Closure writer ->
                    if (!written.add(path)) return
                    zip.putNextEntry(new java.util.zip.ZipEntry(path))
                    writer(zip)
                    zip.closeEntry()
                }
                index.files.findAll { it.env?.server != "unsupported" && !excludedJar(it.path) }.each { entry ->
                    if (jarMatches(entry.path as String, serverDownloadedJars)) {
                        downloads << "${entry.hashes.sha512} ${entry.downloads[0]} ${entry.path}"
                        return
                    }
                    def file = fetch(entry.downloads[0] as String, entry.hashes.sha512 as String)
                    put(entry.path as String) { it << file.bytes }
                }
                def missing = serverDownloadedJars.findAll { prefix -> !downloads.any { it.split(' ', 3)[2].substring(5).startsWith(prefix) } }
                if (!missing.isEmpty()) throw new GradleException("pack_server_downloaded_jars has no matching mod for ${missing.join(', ')}")
                put("downloads.txt") { it << (downloads.join("\n") + "\n").getBytes("UTF-8") }
                ["server-overrides/", "overrides/"].each { prefix ->
                    source.entries().findAll { !it.directory && it.name.startsWith(prefix) }.each { entry ->
                        def path = entry.name.substring(prefix.length())
                        if (excludedJar(path) || serverExcludedOverrides.any { path.startsWith(it) }) return
                        put(path) { stream -> source.getInputStream(entry).withCloseable { stream << it } }
                    }
                }
                def installer = fetch(neoInstallerUrl, null)
                put("neoforge-installer.jar") { it << installer.bytes }
                serverPackFiles.listFiles().sort { it.name }.each { file ->
                    put(file.name) { it << file.bytes }
                }
            }
        }
        logger.lifecycle("Server pack exported to ${out}")
    }
}

def curseforgeConfig = layout.projectDirectory.file("pack-curseforge.json").asFile
def curseforgeDir = layout.buildDirectory.dir("pack/curseforge")
def curseforgePack = layout.buildDirectory.file("pack/${pack_name.replace(' ', '-')}-${packVersion}-curseforge.zip")

var stageCurseForge = tasks.register("stageCurseForge", Exec) {
    group = "spiced cider"
    description = "Copies the staged release to build/pack/curseforge with CurseForge metadata wherever CurseForge has the file"
    dependsOn(refreshRelease)
    inputs.file(curseforgeConfig)
    outputs.upToDateWhen { false }
    commandLine python, file("scripts/curseforge_convert.py").absolutePath, releaseDir.get().asFile.absolutePath,
            curseforgeDir.get().asFile.absolutePath, "--config", curseforgeConfig.absolutePath,
            "--cache", downloadCache.absolutePath, "--packwiz", packwiz
}

var refreshCurseForge = tasks.register("refreshCurseForge", Exec) {
    group = "spiced cider"
    dependsOn(stageCurseForge)
    workingDir = curseforgeDir.get().asFile
    commandLine packwiz, "refresh"
}

var exportCurseForgePack = tasks.register("exportCurseForgePack", Exec) {
    group = "spiced cider"
    description = "Exports the CurseForge modpack zip; non-CurseForge files are bundled in overrides"
    dependsOn(refreshCurseForge)
    workingDir = curseforgeDir.get().asFile
    outputs.file(curseforgePack)
    outputs.upToDateWhen { false }
    doFirst { curseforgePack.get().asFile.parentFile.mkdirs() }
    commandLine packwiz, "curseforge", "export", "--output", curseforgePack.get().asFile.absolutePath
}

def instanceZip = layout.buildDirectory.file("pack/${pack_name.replace(' ', '-')}-Prism-Instance.zip")
def devInstanceZip = layout.buildDirectory.file("pack/${pack_name.replace(' ', '-')}-Dev-Prism-Instance.zip")
def devInstanceName = "${pack_name} (dev branch)"
def devPackUrl = "https://evanbones.github.io/Spiced-Cider/dev/pack.toml"
def instanceFiles = layout.projectDirectory.dir("instance").asFile
def packIcon = new File(instanceFiles, "icon.png")
def unsupUrl = "https://cdn.modrinth.com/data/Rqwcr9qN/versions/qeqq6YGW/unsup-1.2.0-pre4.jar"
def unsupSha512 = "b17c080f7dc4c14c11a9f1cdf60dd102ae346d842dab389619c7e3e4a13a1ec642039f74fd6f35b71336034a21a6764d28ccc8936740a8261720993beac3178a"
def mcVersion = minecraft_version
def neoVersion = neo_version
def fetchUnsup = {
    def unsup = new File(downloadCache, unsupSha512)
    if (!unsup.exists()) {
        unsup.parentFile.mkdirs()
        def tmp = new File(unsup.path + ".part")
        new URL(unsupUrl).withInputStream { input -> tmp.withOutputStream { it << input } }
        def actual = java.security.MessageDigest.getInstance("SHA-512").digest(tmp.bytes).encodeHex().toString()
        if (actual != unsupSha512) {
            tmp.delete()
            throw new GradleException("Hash mismatch for ${unsupUrl}")
        }
        tmp.renameTo(unsup)
    }
    unsup
}

def writeInstanceZip = { File out, Closure<String> cfg, Closure<String> ini ->
    def unsup = fetchUnsup()
    out.parentFile.mkdirs()
    new java.util.zip.ZipOutputStream(out.newOutputStream()).withCloseable { zip ->
        def put = { String path, byte[] bytes ->
            zip.putNextEntry(new java.util.zip.ZipEntry(path))
            zip.write(bytes)
            zip.closeEntry()
        }
        put("instance.cfg", cfg(new File(instanceFiles, "instance.cfg").getText("UTF-8")).getBytes("UTF-8"))
        put("mmc-pack.json", new File(instanceFiles, "mmc-pack.json").getText("UTF-8")
                .replace("@minecraft@", mcVersion).replace("@neoforge@", neoVersion).getBytes("UTF-8"))
        put("spicedcider.png", packIcon.bytes)
        put("minecraft/unsup.ini", ini(new File(instanceFiles, "unsup.ini").getText("UTF-8")).getBytes("UTF-8"))
        put("minecraft/unsup.jar", unsup.bytes)
    }
}

tasks.register("exportInstance") {
    group = "spiced cider"
    description = "Builds a Prism/MultiMC instance zip that installs and updates the pack through unsup"
    inputs.dir(instanceFiles)
    inputs.file(packIcon)
    inputs.property("mc", mcVersion)
    inputs.property("neo", neoVersion)
    outputs.file(instanceZip)
    doLast {
        def out = instanceZip.get().asFile
        writeInstanceZip(out, { it }, { it })
        logger.lifecycle("Prism instance exported to ${out}")
    }
}

tasks.register("exportDevInstance") {
    group = "spiced cider"
    description = "Builds a Prism/MultiMC instance zip that follows the dev branch pack through unsup"
    inputs.dir(instanceFiles)
    inputs.file(packIcon)
    inputs.property("mc", mcVersion)
    inputs.property("neo", neoVersion)
    inputs.property("name", devInstanceName)
    inputs.property("source", devPackUrl)
    outputs.file(devInstanceZip)
    doLast {
        def out = devInstanceZip.get().asFile
        writeInstanceZip(out,
                { it.replaceFirst(/(?m)^name=.*$/, "name=${devInstanceName}")
                        .replaceFirst(/(?m)^notes=.*$/, "notes=Follows the dev branch and updates itself on every launch.") },
                { it.replaceFirst(/(?m)^source=.*$/, "source=${devPackUrl}")
                        .replaceFirst(/(?m)^modpack_name=.*$/, "modpack_name=${devInstanceName}") })
        logger.lifecycle("Dev Prism instance exported to ${out}")
    }
}

def serverUpdaterZip = layout.buildDirectory.file("pack/${pack_name.replace(' ', '-')}-Server-Updater.zip")
def serverUpdaterFiles = layout.projectDirectory.dir("server-updater").asFile
evaluationDependsOn(":server-launcher")
def launcherJar = project(":server-launcher").tasks.named("jar")

tasks.register("exportServerUpdater") {
    group = "spiced cider"
    description = "Builds a server zip whose launcher installs and auto-updates the pack through unsup"
    def launcherArchive = launcherJar.flatMap { it.archiveFile }
    inputs.file(launcherArchive)
    inputs.dir(serverUpdaterFiles)
    outputs.file(serverUpdaterZip)
    doLast {
        def unsup = fetchUnsup()
        def out = serverUpdaterZip.get().asFile
        out.parentFile.mkdirs()
        new java.util.zip.ZipOutputStream(out.newOutputStream()).withCloseable { zip ->
            def put = { String path, byte[] bytes ->
                zip.putNextEntry(new java.util.zip.ZipEntry(path))
                zip.write(bytes)
                zip.closeEntry()
            }
            serverUpdaterFiles.listFiles().sort { it.name }.each { put(it.name, it.bytes) }
            put("unsup.jar", unsup.bytes)
            put("spicedcider-server.jar", launcherArchive.get().asFile.bytes)
        }
        logger.lifecycle("Server updater exported to ${out}")
    }
}

def packSlug = pack_modrinth_slug

publishMods {
    file = mrpack
    dryRun = providers.gradleProperty("dry_run").isPresent()
    changelog = file("CHANGELOG-LATEST.md").exists() ? file("CHANGELOG-LATEST.md").text : ""
    type = STABLE
    version = packVersion
    displayName = "${pack_name} ${packVersion}"
    modLoaders.add("neoforge")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = providers.provider {
            def connection = new URL("https://api.modrinth.com/v2/project/${packSlug}").openConnection()
            def token = System.getenv("MODRINTH_TOKEN")
            if (token) connection.setRequestProperty("Authorization", token)
            try {
                connection.inputStream.withCloseable { new JsonSlurper().parse(it).id as String }
            } catch (Exception ignored) {
                throw new GradleException("Modrinth project '${packSlug}' was not found")
            }
        }
        minecraftVersions.add(minecraft_version)
    }
}

tasks.matching { it.name.startsWith("publish") }.configureEach {
    dependsOn(exportPack, exportServerPack)
}

tasks.register("publishCurseForgePack") {
    group = "spiced cider"
    description = "Uploads the CurseForge modpack zip with the server pack as its additional file"
    dependsOn(exportCurseForgePack, exportServerPack)
    def token = providers.environmentVariable("CURSEFORGE_TOKEN")
    def dryRun = providers.gradleProperty("dry_run").isPresent()
    def projectId = pack_curseforge_id
    def displayName = "${pack_name} ${packVersion}"
    def changelogFile = file("CHANGELOG-LATEST.md")
    def packFile = curseforgePack
    def serverFile = serverPack
    def parentFile = providers.gradleProperty("curseforge_parent")
    def onActions = providers.environmentVariable("GITHUB_ACTIONS").isPresent()
    doLast {
        def pack = packFile.get().asFile
        def server = serverFile.get().asFile
        if (dryRun) {
            logger.lifecycle("Dry run: would upload ${pack.name} (${pack.length()} bytes) as '${displayName}' for Minecraft ${mcVersion}, then ${server.name} (${server.length()} bytes) as its additional file")
            return
        }
        if (!token.isPresent()) throw new GradleException("CURSEFORGE_TOKEN is not set")
        def changelog = changelogFile.exists() ? changelogFile.text : ""
        def uploader = new CurseForgeUpload(token.get(), projectId)
        int fileId
        if (parentFile.isPresent()) {
            fileId = parentFile.get() as int
        } else {
            try {
                int gameVersion = uploader.minecraftVersionId(mcVersion)
                fileId = uploader.upload(pack, [changelog: changelog, changelogType: "markdown", displayName: displayName,
                                                gameVersions: [gameVersion], releaseType: "release"])
            } catch (Exception e) {
                def hint = "CurseForge modpack upload failed. Re-run the Release workflow on main with curseforge=true."
                if (onActions) println("::error title=CurseForge upload::${hint}")
                throw new GradleException(hint, e)
            }
            logger.lifecycle("Uploaded ${pack.name} to CurseForge as file ${fileId}")
        }
        int serverId
        try {
            serverId = uploader.upload(server, [changelog: changelog, changelogType: "markdown", displayName: "${displayName} Server Pack".toString(),
                                                parentFileID: fileId, releaseType: "release"])
        } catch (Exception e) {
            def hint = "CurseForge server pack upload failed. Re-run the Release workflow on main with curseforge=true and curseforge_parent=${fileId}."
            if (onActions) println("::error title=CurseForge upload::${hint}")
            throw new GradleException(hint, e)
        }
        logger.lifecycle("Uploaded ${server.name} to CurseForge as server pack file ${serverId}")
    }
}

class CurseForgeUpload {
    static final String API = "https://minecraft.curseforge.com/api"
    final String token
    final String projectId
    final java.net.http.HttpClient client = java.net.http.HttpClient.newBuilder().version(java.net.http.HttpClient.Version.HTTP_1_1).followRedirects(java.net.http.HttpClient.Redirect.NORMAL).build()

    CurseForgeUpload(String token, String projectId) {
        this.token = token
        this.projectId = projectId
    }

    Object send(java.net.http.HttpRequest request) {
        int attempts = 3
        for (int attempt = 1; ; attempt++) {
            String failure
            try {
                def response = client.send(request, java.net.http.HttpResponse.BodyHandlers.ofString())
                if (response.statusCode() < 300) return new JsonSlurper().parseText(response.body())
                failure = "CurseForge ${request.uri()} returned ${response.statusCode()}: ${response.body()}"
                if (response.statusCode() < 500) throw new GradleException(failure)
            } catch (IOException e) {
                failure = "CurseForge ${request.uri()} failed: ${e}"
            }
            if (attempt == attempts) throw new GradleException(failure)
            int wait = 30 * attempt
            println("${failure}; retrying in ${wait} s (attempt ${attempt + 1} of ${attempts})")
            Thread.sleep(wait * 1000L)
        }
    }

    Object get(String path) {
        send(java.net.http.HttpRequest.newBuilder(URI.create(API + path)).header("X-Api-Token", token).build())
    }

    int minecraftVersionId(String version) {
        Set types = get("/game/version-types").findAll { it.slug.startsWith("minecraft-") }.collect { it.id } as Set
        def match = get("/game/versions").find { it.name == version && types.contains(it.gameVersionTypeID) }
        if (match == null) throw new GradleException("CurseForge has no Minecraft ${version} game version")
        match.id as int
    }

    int upload(File file, Map metadata) {
        String boundary = "----spicedcider" + UUID.randomUUID().toString().replace("-", "")
        String crlf = "\r\n"
        String head = "--" + boundary + crlf + "Content-Disposition: form-data; name=\"metadata\"" + crlf + "Content-Type: application/json" + crlf + crlf +
                groovy.json.JsonOutput.toJson(metadata) + crlf + "--" + boundary + crlf +
                "Content-Disposition: form-data; name=\"file\"; filename=\"" + file.name + "\"" + crlf + "Content-Type: application/zip" + crlf + crlf
        String tail = crlf + "--" + boundary + "--" + crlf
        def body = java.net.http.HttpRequest.BodyPublishers.concat(
                java.net.http.HttpRequest.BodyPublishers.ofByteArray(head.getBytes("UTF-8")),
                java.net.http.HttpRequest.BodyPublishers.ofFile(file.toPath()),
                java.net.http.HttpRequest.BodyPublishers.ofByteArray(tail.getBytes("UTF-8")))
        def request = java.net.http.HttpRequest.newBuilder(URI.create(API + "/projects/" + projectId + "/upload-file"))
                .header("X-Api-Token", token)
                .header("Content-Type", "multipart/form-data; boundary=" + boundary)
                .timeout(java.time.Duration.ofMinutes(30))
                .POST(body).build()
        send(request).id as int
    }
}
