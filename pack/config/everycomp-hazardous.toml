[woodtype]
	#Exclude WoodType from all of Modules
	#    EXAMPLE: blacklist = [
	#        "forestry:.*fireproof.*",		COMMENT: .* is an RegEx, it exclude all of WoodType containing "fireproof" from Forestry
	#        "biomesoplenty:.*",			COMMENT: .* is an RegEx, it exclude all of WoodType from Wood Mod for any Module
	#        "biomesoplenty:redwood"		COMMENT: exclude redwood from Wood Mod for any module
	#    ]
	#
	blacklist = [
		"quark:ancient",
		"quark:blossom",
		"quark:azalea",
		"environmental:willow",
		"environmental:pine",
		"environmental:plum",
		"upgrade_aquatic:river",
		"autumnity:maple",
		"minecraft:poplar"
	]

[leavestype]
	#Exclude LeavesType from all of Modules
	#	The example is same as WoodType's
	blacklist = [
		"quark:ancient",
		"quark:blue_blossom",
		"quark:lavender_blossom",
		"quark:orange_blossom",
		"quark:yellow_blossom",
		"quark:red_blossom",
		"environmental:willow",
		"environmental:pine",
		"environmental:plum",
		"environmental:cheerful_plum",
		"environmental:moody_plum",
		"environmental:wisteria",
		"upgrade_aquatic:river",
		"autumnity:maple",
		"autumnity:yellow_maple",
		"autumnity:orange_maple",
		"autumnity:red_maple",
		"culturaldelights:lemon",
		"culturaldelights:fruiting_lemon",
		"culturaldelights:fruiting_avocado",
		"nomansland:walnut",
		"minecraft:red_poplar",
		"minecraft:orange_poplar",
		"minecraft:yellow_poplar"
	]

[block]
	#Exclude a specific WoodType/LeavesType block
	#    This is only applied to Wood-Good.
	#    EXAMPLE: blacklist = [
	#        "chipped/biomesoplenty/checkered_redwood_trapdoor",	COMMENT: excluded a checkered_trapdoor from Chipped with Biomes-O'-Plenty's redwood
	#        "variantvanillablocks/biomesoplenty/fir_chest",		COMMENT: excluded a chest from Variant-Vanilla-Blocks with Biomes-O'-Plenty's fir
	#        ".*/biomesoplenty/fir_chest",							COMMENT: .* is an RegEx, so it exclude fir_chest from any Supported-Mods with just Biomes-O'-Plenty (Wood-Mods)
	#        "chipped/.*/fir_chest",								COMMENT: .* is an RegEx, so it exclude fir_chest from any Wood-Mods with just chipped (Supported-Mod)
	#        ".*fir_chest",											COMMENT: .* is an RegEx, so it exclude fir_chest from any Supported-Mods & Wood-Mods
	#    ]
	#
	blacklist = [
		".*/bountifulfares/large_walnut_boat",
		".*/bountifulfares/walnut_furnace_boat",
		".*/bountifulfares/chiseled_walnut_bookshelf",
		".*/bountifulfares/walnut_beehive",
		".*/bountifulfares/walnut_ladder",
		".*/nomansland/apple_fruit_leaf_pile",
		".*/nomansland/pear_fruit_leaf_pile",
		".*/bountifulfares/walnut_railing",
		".*/bountifulfares/walnut_window",
		".*/bountifulfares/walnut_window_pane",
		".*/nomansland/walnut_shelf",
		".*/bountifulfares/trimmed_walnut_planks",
		".*/bountifulfares/walnut_bookshelf",
		".*/bountifulfares/trapped_walnut_chest",
		".*/bountifulfares/walnut_chest",
		".*/caverns_and_chasms/azalea_chest",
		".*/caverns_and_chasms/trapped_azalea_chest",
		".*/environmental/trapped_wisteria_chest",
		".*/environmental/wisteria_chest",
		".*/nomansland/hollow_walnut_log",
		".*/upgrade_aquatic/driftwood_chest",
		".*/upgrade_aquatic/trapped_driftwood_chest",
		".*/nomansland/bundled_stripped_walnut_posts",
		".*/nomansland/bundled_walnut_posts",
		".*/nomansland/cut_stripped_walnut_post",
		".*/nomansland/cut_walnut_post",
		".*/nomansland/stripped_walnut_post",
		".*/nomansland/walnut_post"
	]

[entryset]
	#Exclude EntrySet from the module for All of WoodType or LeavesType
	#    This is only applied to Wood-Good.
	#    EXAMPLE: blacklist = [
	#        "chipped:checkered_trapdoor",		COMMENT: chipped:checkered_oak_trapdoor without "oak"
	#        "variantvanillablocks:chest",		COMMENT: variantvanillablocks:oak_chest without "oak"
	#        "chipped:.*"						COMMENT: .* is an regex which will exclude all of EntrySets from one Module - Wood-Good ONLY
	#    ]
	#    NOTE: This excluded one entryset from all WoodTypes/LeavesTypes
	#
	blacklist = [
		"architects_palette:boards",
		"architects_palette:board_slab",
		"architects_palette:board_stairs",
		"architects_palette:board_wall",
		"quark:vertical_planks",
		"quark:post",
		"quark:stripped_post",
		"quark:bookshelf",
		"quark:ladder",
		"quark:vertical_slab",
		"woodworks:trapped_chest",
		"woodworks:chest",
		"woodworks:bookshelf",
		"woodworks:closet",
		"woodworks:trapped_closet"
	]

[module]
	#Exclude Module From Wood-Good, Stone-Zone & Gems-Realm
	#    EXAMPLE: blacklist = [
	#        "chipped",
	#        "variantvanillablocks"
	#    ]
	#
	blacklist = []

[other]
	#Disable all of Supported Mods on EveryCompat's side. This feature is same as Library-Section which do not have any Wood Modules.
	#WARNING: If the config between CLIENT & SERVER are not the same, then you won't able to join a server
	include_all_wood_modules = true
