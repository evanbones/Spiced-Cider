[compat]
	#Disables Slime Time's feature where clicking slimeballs together in inventory merges them. Requires Slime Time.
	slimeTimeDisableItemMerging = true
	#Use Environmental's old 1.19 wisteria tree leaf generation instead of the current sparse/patchy one. Requires Environmental (obviously).
	oldWisteriaTrees = true
	#Stops Voxy World Gen V2 from discarding the client's pause callback when a world loads, so chunk generation actually halts while the pause menu is open instead of running until the heap is exhausted. Requires Voxy World Gen V2.
	voxyWorldGenPauseFix = true
	#Replaces Voxy World Gen V2's LOD catch-up pass with one that never blocks the server thread on a chunk request. Fixes the client hanging forever on Save & Quit to Title, especially alongside C2ME. Requires Voxy World Gen V2.
	voxyWorldGenSafeCatchup = true
	#Lets the LOD catch-up pass pull already-generated chunks back off disk so distant terrain still syncs to players who join after generation finished. Requires Voxy World Gen V2 and Safe Catch-Up.
	voxyWorldGenSyncUnloadedChunks = true

[gameplay]
	#Beds don't explode outside the Overworld; instead they show a message and wake sleeping villagers.
	bedExplosionPrevention = true
	#Respawn anchors don't explode outside dimensions where they work; instead they show a message.
	respawnAnchorExplosionPrevention = true
	#End crystals can be placed on any block, not just obsidian/bedrock.
	endCrystalPlaceAnywhere = true
	#End crystals with no beam target heal nearby damaged entities and render a beam to their heal target.
	endCrystalHealing = true
	#Enchanted, named, or elytra items become "Broken" instead of being destroyed when they run out of durability.
	keepBrokenItems = true
	#Tamed wolves can be equipped with horse/animal armor as body armor.
	wolvesWearAnyArmor = true
	#Spiders switch to shooting cobweb projectiles at range when their target is trapped.
	spiderRangedWebAttacks = true
	#Removes quasi-connectivity from pistons, dispensers, and droppers.
	removeQuasiConnectivity = true

[performance]
	#Disables recipe book unlock tracking/saving/syncing entirely. Saves memory and disk I/O.
	disableRecipeBookTracking = true
