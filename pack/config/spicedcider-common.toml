[compat]
	#Disables Slime Time's feature where clicking slimeballs together in inventory merges them. Requires Slime Time.
	slimeTimeDisableItemMerging = true
	#Use Environmental's old 1.19 wisteria tree leaf generation instead of the current sparse/patchy one. Requires Environmental (obviously).
	oldWisteriaTrees = true

[gameplay]
	#Beds don't explode outside the Overworld; instead they show a message and wake sleeping villagers.
	bedExplosionPrevention = true
	#Respawn anchors don't explode outside dimensions where they work; instead they show a message.
	respawnAnchorExplosionPrevention = true
	#End crystals can be placed on any block, not just obsidian/bedrock.
	endCrystalPlaceAnywhere = true
	#End crystals with no beam target heal nearby damaged entities and render a beam to their heal target.
	endCrystalHealing = true
	#Enchanted, named, or elytra items become "Broken" instead of being destroyed when they run out of durability.
	keepBrokenItems = true
	#Tamed wolves can be equipped with horse/animal armor as body armor.
	wolvesWearAnyArmor = true
	#Spiders switch to shooting cobweb projectiles at range when their target is trapped.
	spiderRangedWebAttacks = true
	#Removes quasi-connectivity from pistons, dispensers, and droppers.
	removeQuasiConnectivity = true

[voidWater]
	#Fluids at the bottom of the world spill into the void as fading trails you can swim in. Takes effect when a world is next loaded.
	voidWater = true
	#How many blocks fluid trails extend below the bottom of the world.
	# Default: 16
	# Range: 0 ~ 255
	voidWaterTrailLength = 16
	#How quickly void fluid trails fade out. Higher values fade faster.
	# Default: 2.0
	# Range: 0.05 ~ 16.0
	voidWaterTrailDecay = 2.0
	#Dimension ids where fluids never spill into the void. The End is excluded by default because its floor is a sea of Dimensional Tears.
	voidWaterExcludedDimensions = ["minecraft:the_end"]

[performance]
	#Disables recipe book unlock tracking/saving/syncing entirely. Saves memory and disk I/O.
	disableRecipeBookTracking = true

[caveMaps]
	#Maps in the Nether and other dimensions with a ceiling show the terrain at a usable height instead of the bedrock roof.
	caveMaps = true
	#In dimensions with a ceiling, maps show the terrain at the height where they were created. When off, the fixed height is used.
	caveMapsUseCreationHeight = true
	#Height maps show in dimensions with a ceiling when Use Map Creation Height is off.
	# Default: 100
	# Range: -64 ~ 320
	caveMapsFixedHeight = 100
	#Entries like minecraft:the_nether=40. Maps in these dimensions always show this height, overriding the other settings.
	caveMapsFixedHeights = ["minecraft:the_nether=40"]
	#Dimension ids where maps always show the height they were created at, even without a ceiling.
	caveMapsCreationHeightDimensions = []

[lod]
	#Generates terrain beyond your render distance in the background so Voxy can show it, out to your Distant Terrain Range. The chunks are never saved, so the world folder doesn't grow.
	lodGeneration = true
	#Server-side cap, in chunks, on how far LoD terrain is generated around each player. Each player's own Voxy LoD render distance is used up to this limit.
	# Default: 128
	# Range: 8 ~ 512
	lodGenerationMaxRadius = 128
	#Worker threads used to generate LoD terrain. 0 picks automatically: an eighth of your CPU threads, between 1 and 4. More is faster but costs frame rate while terrain is generating. Requires rejoining the world.
	# Default: 0
	# Range: 0 ~ 16
	lodGenerationThreads = 0
	#Chunks per second sent to each player on a server. Singleplayer hands chunks to Voxy directly and ignores this.
	# Default: 100
	# Range: 10 ~ 2000
	lodGenerationSendRate = 100
