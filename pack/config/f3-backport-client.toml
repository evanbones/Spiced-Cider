[F3-Backport]
	#Enable the mod?
	#(true/false)
	#Default is true.
	enable_mod = true
	#The scale of the debug (F3) screen
	#Set to -1 to follow the current Minecraft Gui Scale setting
	#Set to 0 for the Minecraft 'auto' setting
	# Default: 2
	# Range: -1 ~ 5
	debug_gui_scale = 2

	[F3-Backport.Priority]
		#Enable the Game Version entry?
		#(true/false)
		#Default is true.
		enable_game_version = true
		#Enable the FPS entry
		#(true/false)
		#Default is true.
		enable_fps = true

	[F3-Backport.Position]
		#Enable the Player Position entry?
		#(true/false)
		#Default is true.
		enable_player_position = false
		#Enable the Player Speed entry?
		#(true/false)
		#Default is false.
		enable_player_speed = false
		#Enable the Player Section Position entry?
		#(true/false)
		#Default is true.
		enable_player_section_position = true
		#Enable the Biome entry?
		#(true/false)
		#Default is true.
		enable_biome = false

	[F3-Backport.Memory]
		#Enable the Memory entry?
