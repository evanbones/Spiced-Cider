[naming]
	#Auto-generates a random world name on the world creation screen, with a reroll button if Modern World Creation is present.
	randomWorldNaming = true

[misc]
	#Plays C418 - Death when you die.
	customDeathSound = true
	#Spawns sparks, plays hit sounds, and displays a warning message when attempting to mine a block that requires a stronger tool.
	unmineableBlockSparks = true
	#Customize the OS window title bar text.
	customWindowTitle = true
	#Format string for the OS window title. %v will be replaced with the current Minecraft version.
	windowTitleFormat = "Minecraft - Spiced Cider %v"
	#Restore classic style loading/progress screen when loading worlds, saving worlds, or changing dimensions.
	oldProgressScreen = true
	#Replace the vanilla Options screen with Spiced Cider's single settings screen (sidebar pages, curated options). Keybinds the screen hides are unbound.
	customOptionsScreen = true
	#Removes the rename text field from the anvil screen.
	anvilHideNameField = true
	#While sleeping, the chat box is replaced by gameplay tips.
	bedScreenTips = true
	#Moves the recipe book button in the inventory screen to the right, beside the crafting grid.
	moveRecipeBookButton = true
	#Hides your own potion effect particles in first person.
	hideOwnEffectParticles = true
	#Removes the "Applies to" and "Ingredients" lines from smithing template tooltips.
	hideSmithingTemplateTooltips = true

[vista]
	#Applies performance fixes to Vista's mirror/TV reflection rendering (better culling, better shared-states, re-render throttling). Requires Vista (obviously).
	vistaMirrorPerfFixes = true
	#Max distance in blocks that terrain and entities render to inside a mirror reflection. Only lowers Vista's own television.render_distance (which affects TVs and mirrors). Does not affect TV live feeds.
	# Default: 64
	# Range: 16 ~ 2048
	vistaMirrorReflectionDistance = 64
	#Regular reflection render rate per mirror, in updates per second, when the frame budget is not under pressure.
	# Default: 30.0
	# Range: 1.0 ~ 240.0
	vistaMirrorUpdateFps = 30.0
	#The floor that the mirror update rate will never drop below. Values above the base update rate are ignored.
	# Default: 4.0
	# Range: 0.25 ~ 240.0
	vistaMirrorMinUpdateFps = 4.0
	#Reflection update rate used while the viewer's eye is stationary. Set equal to update rate to disable the idle slowdown.
	# Default: 5.0
	# Range: 0.25 ~ 240.0
	vistaMirrorIdleUpdateFps = 5.0
	#Max milliseconds per frame that all mirror reflection renders may take before being throttled.
	# Default: 3.5
	# Range: 0.5 ~ 1000.0
	vistaMirrorThrottleBudgetMs = 3.5
	#Draws thick fog inside mirror reflections and TV feeds, scaled to the mirror reflection distance, so the shortened view fades out instead of ending abruptly. Requires Mirror Performance Fixes.
	vistaMirrorFog = true
	#Distance where mirror fog begins, as a percentage of the mirror reflection distance.
	# Default: 20
	# Range: 0 ~ 100
	vistaMirrorFogStart = 20
	#Distance where mirror fog becomes fully opaque, as a percentage of the mirror reflection distance.
	# Default: 90
	# Range: 10 ~ 100
	vistaMirrorFogEnd = 90

[compat]
	#Hides the arrow depth line (Shallow hit, Lodged, Deep lodged) from Lodged's inventory arrow tooltip. Requires Lodged.
	lodgedHideArrowDepth = true
	#Hides the Bleeding risk line from Lodged's inventory arrow tooltip. Requires Lodged.
	lodgedHideBleedingRisk = true
	#Hides the voice chat HUD while playing in a world that isn't open to LAN. Requires Simple Voice Chat.
	voiceChatHideSingleplayerHud = true
	#Replaces Clutter No More's scrolling shape switcher with a radial wheel, and makes the controller shape button hold-to-open. Requires Clutter No More.
	clutterNoMoreShapeWheel = true
	#Adds an EMI category for tapping trees with a tap. Requires EMI and No Man's Land. Reload EMI or rejoin the world to apply.
	emiTappingCategory = true
	#Adds an EMI category for what sluices filter out of each fluid. Requires EMI and Spelunkery. Reload EMI or rejoin the world to apply.
	emiSluicingCategory = true
	#Adds an EMI category for what piglins give in exchange for gold. Requires EMI. Reload EMI or rejoin the world to apply.
	emiBarteringCategory = true
	#Adds an EMI category for what sniffers dig up. Requires EMI. Reload EMI or rejoin the world to apply.
	emiSniffingCategory = true
	#Adds an EMI category for what brushing suspicious blocks can uncover. Requires EMI. Reload EMI or rejoin the world to apply.
	emiArchaeologyCategory = true
	#Adds an EMI category for the loot found in each structure's chests. Requires EMI. Reload EMI or rejoin the world to apply.
	emiStructureLootCategory = true
	#When the creative tab panel is on the right side of the item list, its tabs are drawn on the right edge too. Requires REMI.
	remiRightSideTabs = true
	#Removes the smithing table category from EMI. Requires EMI.
	emiHideSmithingCategory = true
	#EMI shows haunting under a soul campfire instead of an encased fan, and hides the fan washing, smoking and blasting categories. Requires EMI and Create.
	emiCreateFanRework = true
	#Hides the hold-shift item descriptions Create adds to item tooltips. Requires Create.
	createHideItemDescriptions = true
	#Hides the item information pages Quark adds to the recipe viewer. Requires Quark.
	quarkHideHints = true
	#Replaces No Man's Land's carving menu with a radial wheel. Requires No Man's Land.
	carvingWheel = true
	#Golden dandelions give off drifting golden specks. Requires Tiny Takeover Backport.
	goldenDandelionParticles = true

[voxy]
	#Replaces the terrain fog with configurable start and end distances that cover Voxy's LoD terrain, plus weather and cave fog. Disable to use Roxy's own fog.
	voxyFogOverride = true
	#Distance where the fog begins, as a percentage of the Voxy LoD render distance (or the normal render distance if Voxy is not rendering).
	# Default: 0
	# Range: -100 ~ 100
	voxyFogStart = 0
	#Distance where the fog becomes fully opaque, as a percentage of the Voxy LoD render distance (or the normal render distance if Voxy is not rendering).
	# Default: 85
	# Range: 1 ~ 100
	voxyFogEnd = 85
	#How much closer the fog gets during rain, snow and thunderstorms. Thunderstorms count for twice as much as rain. 0% disables weather fog.
	# Default: 90
	# Range: 0 ~ 100
	voxyWeatherFogDensity = 90
	#How much closer the fog gets when you are underground, away from the sky. 0% disables cave fog.
	# Default: 50
	# Range: 0 ~ 100
	voxyCaveFogDensity = 50
	#How much closer the fog gets in the Nether's hazy air. 0% matches the Overworld.
	# Default: 50
	# Range: 0 ~ 100
	voxyNetherFogDensity = 50

[weather]
	#How many seconds clouds take to fade between cloud cover states when the weather changes naturally.
	# Default: 40
	# Range: 1 ~ 300
	cloudCoverFadeSeconds = 40
	#How many seconds clouds take to fade when the weather is changed with /weather. 0 switches instantly.
	# Default: 5
	# Range: 0 ~ 60
	cloudCoverCommandFadeSeconds = 5
	#Show the rare halos of light that sometimes form on either side of the sun.
	sunDogs = true

[nether]
	#Distant terrain in the Nether shimmers in the heat, more strongly and closer up near lava. Also scaled by the Distortion Effects accessibility option.
	netherHeatHaze = true
	#Faint drifting mist in the Nether air, tinted by the biome. Follows the Particles setting.
	netherMist = true
	#How strongly dark areas of the Nether take on the colour of the biome's air. 0% keeps the vanilla shadows.
	# Default: 60
	# Range: 0 ~ 100
	netherAmbientTint = 60
