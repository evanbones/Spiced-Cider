[naming]
	#Auto-generates a random world name on the world creation screen, with a reroll button if Modern World Creation is present.
	randomWorldNaming = true

[misc]
	#Plays C418 - Death when you die.
	customDeathSound = true
	#Spawns sparks, plays hit sounds, and displays a warning message when attempting to mine a block that requires a stronger tool.
	unmineableBlockSparks = true
	#Customize the OS window title bar text.
	customWindowTitle = true
	#Format string for the OS window title. %v will be replaced with the current Minecraft version.
	windowTitleFormat = "Minecraft - Spiced Cider %v"
	#Restore classic style loading/progress screen when loading worlds, saving worlds, or changing dimensions.
	oldProgressScreen = true

[vista]
	#Applies performance fixes to Vista's mirror/TV reflection rendering (better culling, better shared-states, re-render throttling). Requires Vista (obviously).
	vistaMirrorPerfFixes = true
	#Max distance in blocks that terrain and entities render to inside a mirror reflection. Only lowers Vista's own television.render_distance (which affects TVs and mirrors). Does not affect TV live feeds.
	# Default: 64
	# Range: 16 ~ 2048
	vistaMirrorReflectionDistance = 64
	#Regular reflection render rate per mirror, in updates per second, when the frame budget is not under pressure. Values at or above 20 mean effectively every frame.
	# Default: 15.0
	# Range: 1.0 ~ 240.0
	vistaMirrorUpdateFps = 15.0
	#The floor that the mirror update rate will never drop below. Values above the base update rate are ignored.
	# Default: 4.0
	# Range: 0.25 ~ 240.0
	vistaMirrorMinUpdateFps = 4.0
	#Reflection update rate used while the viewer's eye is stationary. Set equal to update rate to disable the idle slowdown.
	# Default: 5.0
	# Range: 0.25 ~ 240.0
	vistaMirrorIdleUpdateFps = 5.0
	#Max milliseconds per frame that all mirror reflection renders may take before being throttled.
	# Default: 3.5
	# Range: 0.5 ~ 1000.0
	vistaMirrorThrottleBudgetMs = 3.5

[compat]
	#Restores vanilla parity for Sodium's Smooth Lighting corner blending, which stretches light further out than vanilla and causes flicker near moving dynamic light sources (e.g. LambDynamicLights). Requires Sodium.
	sodiumLightingParityFix = true
	#Remembers the received-chunk total in Voxy World Gen V2's debug overlay per world or server, instead of resetting it to zero every time you reconnect. Requires Voxy World Gen V2.
	voxyWorldGenPersistStats = true

[voxy]
	#Replaces the terrain fog with configurable start and end distances that cover Voxy's LoD terrain, plus weather and cave fog. Disable to use Roxy's own fog.
	voxyFogOverride = true
	#Distance where the fog begins, as a percentage of the Voxy LoD render distance (or the normal render distance if Voxy is not rendering).
	# Default: 10
	# Range: 0 ~ 100
	voxyFogStart = 0
	#Distance where the fog becomes fully opaque, as a percentage of the Voxy LoD render distance (or the normal render distance if Voxy is not rendering).
	# Default: 85
	# Range: 1 ~ 100
	voxyFogEnd = 85
	#How much closer the fog gets during rain, snow and thunderstorms. Thunderstorms count for twice as much as rain. 0% disables weather fog.
	# Default: 90
	# Range: 0 ~ 100
	voxyWeatherFogDensity = 90
	#How much closer the fog gets when you are underground, away from the sky. 0% disables cave fog.
	# Default: 50
	# Range: 0 ~ 100
	voxyCaveFogDensity = 50
