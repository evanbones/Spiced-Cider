
[action]

	[action.parcool]

		[action.parcool.grapple]

		[action.parcool.wall_jump]

		[action.parcool.ride_zipline]
			#Allowed Values: DOWN_KEY, TOGGLE, ALWAYS
			input = "DOWN_KEY"

		[action.parcool.wall_run]

		[action.parcool.fast_run]
			#Allowed Values: DOWN_KEY, TOGGLE, ALWAYS
			input = "DOWN_KEY"

		[action.parcool.super_sprint]

		[action.parcool.vault]

		[action.parcool.horizontal_wall_run]
			#Allowed Values: DOWN_KEY, TOGGLE, ALWAYS
			input = "DOWN_KEY"

		[action.parcool.fast_swim]
			#Allowed Values: DOWN_KEY, TOGGLE, ALWAYS
			input = "DOWN_KEY"

		[action.parcool.long_jump]

		[action.parcool.dive]

		[action.parcool.skydive]

		[action.parcool.trick_jump]

		[action.parcool.hide_in_block]

		[action.parcool.crawl]
			#Allowed Values: DOWN_KEY, TOGGLE, ALWAYS
			input = "TOGGLE"

		[action.parcool.slide]

		[action.parcool.hang_on]
			#Allowed Values: DOWN_KEY, TOGGLE, ALWAYS
			input = "DOWN_KEY"

		[action.parcool.climb_up]

		[action.parcool.castaway]

		[action.parcool.hang_down]
			#Allowed Values: DOWN_KEY, TOGGLE, ALWAYS
			input = "DOWN_KEY"

		[action.parcool.pole_climb]
			#Allowed Values: DOWN_KEY, TOGGLE, ALWAYS
			input = "DOWN_KEY"

		[action.parcool.slide_down]
			#Allowed Values: DOWN_KEY, TOGGLE, ALWAYS
			input = "DOWN_KEY"

		[action.parcool.dodge]
			#Allowed Values: PRESS_KEY, RELEASE_KEY
			input = "PRESS_KEY"

		[action.parcool.breakfall]
			#Allowed Values: DOWN_KEY, TOGGLE, ALWAYS
			input = "DOWN_KEY"

		[action.parcool.charge_jump]

[hud]
	#Allowed Values: Light, Hide
	stamina_hud_type = "Hide"
	show_always = false
	hide_automatically = true
	show_status_indicator = false
	# Range: -100 ~ 100
	hud_offset_h = 0
	# Range: -100 ~ 100
	hud_offset_v = 0

[grappling_hook]
	#how much speed widens the view. 0 disables
	# Range: 0.0 ~ 1.0
	fov_intensity = 0.6
	#how far the camera leans towards the rope. 0 disables
	# Range: 0.0 ~ 1.0
	camera_roll_intensity = 0.6
	#how much a loose rope sags. 0 for straight
	# Range: 0.0 ~ 2.0
	rope_sag = 1.0
	#show a marker where the hook would land
	show_target_indicator = true
	#size of that marker in pixels
	# Range: 3 ~ 64
	target_indicator_size = 11
	#log it when the rope ends up inside a block
	debug_rope = false

[other]
	enable_sounds = true
	#Make actions needing fast-run available with normal sprint
	enable_actions_with_sprint = true
