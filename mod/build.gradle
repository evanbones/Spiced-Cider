var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_author             : mod_author,
            mod_description        : mod_description,
            mod_credits            : mod_credits
    ]
    inputs.properties replaceProperties

    from "src/main/templates"
    into "build/generated/sources/modMetadata"

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishMods {
    file = rootProject.layout.projectDirectory.file("bootstrap/build/libs/${mod_id}-${version}.jar")
    changelog = rootProject.file("CHANGELOG-LATEST.md").exists() ? rootProject.file("CHANGELOG-LATEST.md").text : ""
    type = STABLE
    version = "${project.version} - ${project.minecraft_version}"
    displayName = "Spiced Cider ${project.version}"
    modLoaders.add("neoforge")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "" // TODO
        minecraftVersions.add(project.minecraft_version)
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "" // TODO
        minecraftVersions.add(project.minecraft_version)
    }
}

def packDir = rootProject.layout.projectDirectory.dir("pack")

var packwizRefresh = tasks.register("packwizRefresh", Exec) {
    group = "spiced cider"
    workingDir = packDir.asFile
    commandLine packDir.file("packwiz.exe").asFile.absolutePath, "refresh"
}

tasks.matching { it.name.startsWith("publish") && it.name != "publishToMavenLocal" }.configureEach {
    dependsOn(":bootstrap:jar")
}

tasks.register("deployToPack", Copy) {
    group = "spiced cider"
    from(project(":bootstrap").tasks.named("jar"))
    into(packDir.dir("mods"))
    finalizedBy(packwizRefresh)
}
