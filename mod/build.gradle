plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'org.sinytra.adapter.userdev' version '1.2.1-SNAPSHOT'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org'
            }
        }
        filter {
            includeGroup "org.parchmentmc.data"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "CreateMod"
                url = "https://maven.createmod.net"
            }
        }
        filter {
            includeGroup "net.createmod.ponder"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Gegy"
                url = "https://maven.gegy.dev"
            }
        }
        filter {
            includeGroup "dev.lambdaurora.lambdynamiclights"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "CaffeineMC"
                url = "https://maven.caffeinemc.net/releases"
            }
        }
        filter {
            includeGroup "net.caffeinemc"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "TerraformersMC"
                url = "https://maven.terraformersmc.com/"
            }
        }
        filter {
            includeGroup("com.terraformersmc")
            includeGroup("dev.emi")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "cassian's maven"
                url = "https://maven.cassian.cc/"
            }
        }
        filter {
            includeGroupAndSubgroups("cc.cassian")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Greenhouse Maven"
                url = "https://maven.greenhouse.lgbt/releases/"
            }
        }
        filter {
            includeGroup "vectorwing"
            includeGroupAndSubgroups("house.greenhouse")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.wispforest.io"
            }
        }
        filter {
            includeGroupAndSubgroups("io.wispforest")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://jitpack.io"
            }
        }
        filter {
            includeGroup "com.github.Chocohead"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://repo.sleeping.town/"
            }
        }
        filter {
            includeGroup "folk.sisby"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Fuzs Mod Resources"
                url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
            }
        }
        filter {
            includeGroupAndSubgroups "fuzs"
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "Architectury"
                url = "https://maven.architectury.dev/"
            }
        }
        filter {
            includeGroupAndSubgroups("dev.architectury")
            includeGroup("me.shedaniel.cloth")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://jm.gserv.me/repository/maven-public/"
            }
        }
        filter {
            includeGroup("mysticdrew")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.nucleoid.xyz"
            }
        }
        filter {
            includeGroupAndSubgroups("xyz.nucleoid")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://maven.isxander.dev/releases"
                name = "Xander Maven"
            }
        }
        filter {
            includeGroupAndSubgroups("org.quiltmc.parsers")
        }
    }

    flatDir {
        dirs("libs")
    }

    repositories {
        maven { url = "https://maven.enjarai.dev/mirrors" }
        maven {
            name = "MixinSquared"
            url = "https://maven.bawnorton.com/releases"
        }
    }

    maven {
        name = "Sinytra"
        url = "https://maven.sinytra.org/"
    }

    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.WARN
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing-mod', 'infernalexp', '--existing-mod', 'architects_palette'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

