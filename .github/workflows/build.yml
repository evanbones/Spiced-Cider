name: Release

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:
    inputs:
      curseforge:
        description: "Upload the current version to CurseForge even though it is already on Modrinth"
        type: boolean
        default: false
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

env:
  MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

jobs:
  core:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Cider Core Version
        id: check
        run: |
          mod_version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          mc_version=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          version="${mod_version}+${mc_version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: $MODRINTH_TOKEN" "https://api.modrinth.com/v2/project/cider-core/version/$version")
          if [ "$status" = "200" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cider Core $version is already on Modrinth; bump version in gradle.properties to publish a new one"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.check.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        if: steps.check.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Cider Core
        if: steps.check.outputs.publish == 'true'
        run: |
          chmod +x gradlew
          ./gradlew :mod:publishMods --stacktrace

  pack:
    needs: core
    if: always() && (needs.core.result == 'success' || github.event_name == 'pull_request' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Setup Java
        if: github.event_name != 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        if: github.event_name != 'pull_request'
        uses: gradle/actions/setup-gradle@v4

      - name: Update Cider Core In Pack
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          chmod +x gradlew
          ./gradlew :mod:useModrinthCiderCore -Pcider_core_version=${{ needs.core.outputs.version }} --stacktrace
          python3 scripts/patch_pack_index.py pack
          git add -A pack
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Cider Core to ${{ needs.core.outputs.version }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish Modpack
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          pack_version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          slug=$(grep '^pack_modrinth_slug=' gradle.properties | cut -d= -f2 | tr -d '\r')
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: $MODRINTH_TOKEN" "https://api.modrinth.com/v2/project/$slug/version/$pack_version")
          if [ "$status" != "200" ]; then
            ./gradlew :publishMods :publishCurseForgePack --stacktrace
          elif [ "${{ inputs.curseforge }}" = "true" ]; then
            ./gradlew :publishCurseForgePack --stacktrace
          else
            echo "::notice::Spiced Cider $pack_version is already on Modrinth; bump version in gradle.properties to publish a new one"
          fi

      - name: Checkout Other Channel
        if: github.event_name != 'pull_request'
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            git fetch --no-tags --depth=1 origin main
            git worktree add --detach "$RUNNER_TEMP/main" FETCH_HEAD
            echo "MAIN_SRC=$RUNNER_TEMP/main" >> "$GITHUB_ENV"
            echo "DEV_SRC=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          else
            git fetch --no-tags --depth=1 origin dev
            git worktree add --detach "$RUNNER_TEMP/dev" FETCH_HEAD
            echo "MAIN_SRC=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            echo "DEV_SRC=$RUNNER_TEMP/dev" >> "$GITHUB_ENV"
          fi

      - name: Stage Release Pack
        run: |
          python3 -m pip install --quiet brotli
          python3 scripts/stage_release.py "${MAIN_SRC:-.}/pack" _site --release "${MAIN_SRC:-.}/pack-release.json" --base-url https://evanbones.github.io/Spiced-Cider/
          cd _site
          packwiz refresh

      - name: Build Dev Cider Core
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.DEV_SRC }}
        run: |
          chmod +x gradlew
          ./gradlew :bootstrap:jar --stacktrace
          version=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '\r')
          echo "DEV_VERSION=$version" >> "$GITHUB_ENV"
          rm -f pack/mods/cider-core.pw.toml
          cp "bootstrap/build/libs/spicedcider-$version.jar" "pack/mods/spicedcider-$version-dev.jar"

      - name: Stage Dev Pack
        if: github.event_name != 'pull_request'
        run: |
          python3 scripts/stage_release.py "$DEV_SRC/pack" _site/dev --version "$DEV_VERSION-dev" --base-url https://evanbones.github.io/Spiced-Cider/dev/
          cd _site/dev
          packwiz refresh

      - name: Upload Pack Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    needs: pack
    if: always() && needs.pack.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
